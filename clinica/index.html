<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="ValeClinic - Centro de Fisioterapia e Reabilit&atilde;o. Portal de Acesso.">
  <title>ValeClinic | Login</title>
  <link rel="icon" type="image/png" href="assets/logo.png">
  
  <!-- CSS Modular -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/login.css">
</head>
<body>

  <!-- Container Geral Flutuante com Fundo de Recep&ccedil;&atilde;o -->
  <main class="login-container">
    
    <!-- Lado Esquerdo: Branding &amp; Recep&ccedil;&atilde;o da Cl&iacute;nica -->
    <section class="brand-section">
      <div class="brand-content">
        <img id="clinic-logo" src="assets/logo.png" alt="ValeClinic Logo">

        <div class="brand-text-block">
          <h1 class="brand-name">VALE<span>CLINIC</span></h1>
          <p class="brand-tagline">Centro de Fisioterapia e Reabilit&atilde;o</p>
          <p class="brand-slogan">Cuidar do movimento &eacute; transformar vidas</p>
        </div>
      </div>

      <!-- Elemento Curvo Sideral na parte inferior esquerda -->
      <div class="brand-bottom-wave"></div>

      <!-- Divis&oacute;ria Curva Elegante em SVG entre Esquerda e Direita -->
      <svg class="curve-divider" viewBox="0 0 100 1000" preserveAspectRatio="none">
        <path d="M0,0 Q65,500 0,1000 L100,1000 L100,0 Z" fill="#FDFBF7" />
        <path d="M0,0 Q65,500 0,1000" fill="none" stroke="#C5A059" stroke-width="2.5" />
      </svg>
    </section>

    <!-- Lado Direito: Card Flutuante de Formul&aacute;rio -->
    <section class="form-section">
      <div class="login-card">
        
        <!-- Avatar de Usu&aacute;rio -->
        <div class="avatar-header">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
        </div>

        <h2 class="card-title">Bem-vindo(a)!</h2>
        <p class="card-subtitle">Fa&ccedil;a login para acessar o sistema</p>

        <form class="login-form" id="loginForm" novalidate>
          
          <!-- &Aacute;rea de Erro Din&acirc;mica -->
          <div id="loginError" class="login-error-msg" style="display: none;">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
            <span id="loginErrorText">E-mail ou senha incorretos.</span>
          </div>

          <!-- Input 1: E-mail -->
          <div class="input-field">
            <svg class="input-icon-left" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
              <polyline points="22,6 12,13 2,6"></polyline>
            </svg>
            <input type="email" id="email" name="email" class="custom-input" placeholder="Seu e-mail corporativo" required autocomplete="email">
          </div>

          <!-- Input 2: Senha com Toggle de Visibilidade -->
          <div class="input-field">
            <svg class="input-icon-left" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            <input type="password" id="password" name="password" class="custom-input" placeholder="Sua senha" required autocomplete="current-password">
            <button type="button" class="btn-toggle-eye" id="togglePasswordBtn" aria-label="Alternar senha">
              <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
            </button>
          </div>

          <!-- Op&ccedil;&otilde;es: Lembrar-me &amp; Esqueci minha senha -->
          <div class="options-row">
            <label class="remember-label">
              <input type="checkbox" id="rememberMe" checked>
              <span>Lembrar-me</span>
            </label>
            <a href="#" class="forgot-link" onclick="alert('Entre em contato com a administra&ccedil;&atilde;o da cl&iacute;nica para redefinir sua senha.'); return false;">Esqueci minha senha</a>
          </div>

          <!-- Bot&atilde;o Entrar -->
          <button type="submit" class="btn-submit" id="btnSubmit">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <polyline points="12 16 16 12 12 8"></polyline>
              <line x1="8" y1="12" x2="16" y2="12"></line>
            </svg>
            <span id="btnText">ENTRAR</span>
          </button>

        </form>

        <p class="card-copyright">&copy; 2026 ValeClinic. Todos os direitos reservados.</p>
      </div>
    </section>

  </main>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/store.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
